name: Notebook CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notebook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-lane:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: fast-lane (${{ matrix.os }}, py${{ matrix.python-version }}, climada-${{ matrix.climada-label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
        climada-label:
          - "6.1"
        climada-spec:
          - "6.1.*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        shell: bash -l {0}
        run: |
          cat > ci/environment.generated.yml <<'EOF'
          name: starter-packs-ci
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=${{ matrix.python-version }}
            - pip
            - pip:
                - climada==${{ matrix.climada-spec }}
          EOF

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.generated.yml
          activate-environment: starter-packs-ci
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Execute notebooks
        shell: micromamba-shell {0}
        env:
          MODE: "0"
          EXECUTION_TIMEOUT: "7200"
          FAIL_FAST: "1"
        run: |
          chmod +x ./test_build.sh
          ./test_build.sh

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-fast-${{ matrix.os }}-py${{ matrix.python-version }}-climada${{ matrix.climada-label }}
          path: build/test_notebooks/
          if-no-files-found: ignore

  full:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: full (${{ matrix.os }}, py${{ matrix.python-version }}, climada-${{ matrix.climada-label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - python-version: "3.11"
            climada-label: "6.1"
            climada-spec: "6.1.*"
          - python-version: "3.11"
            climada-label: "5"
            climada-spec: "5.*"
          - python-version: "3.10"
            climada-label: "6.1"
            climada-spec: "6.1.*"
          - python-version: "3.10"
            climada-label: "5"
            climada-spec: "5.*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        shell: bash -l {0}
        run: |
          cat > ci/environment.generated.yml <<'EOF'
          name: starter-packs-ci
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=${{ matrix.python-version }}
            - pip
            - pip:
                - climada==${{ matrix.climada-spec }}
          EOF

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.generated.yml
          activate-environment: starter-packs-ci
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Execute notebooks
        shell: micromamba-shell {0}
        env:
          MODE: "0"
          EXECUTION_TIMEOUT: "7200"
          FAIL_FAST: "1"
        run: |
          chmod +x ./test_build.sh
          ./test_build.sh

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-full-${{ matrix.os }}-py${{ matrix.python-version }}-climada${{ matrix.climada-label }}
          path: build/test_notebooks/
          if-no-files-found: ignore
